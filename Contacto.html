<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
</head>
<body style="font-family: 'Candara Light';
             margin: 0;">
    <nav style="background-color: #f3f3f1;
                padding: 25px 120px;">
        <a href="index.html" style="color: black; text-decoration: none; margin-left: 5px;">Home</a>
        <a href="Portada.html" style="color: black; text-decoration: none; margin-left: 5px;">Portada</a>
        <a href="Categorias.html" style="color: black; text-decoration: none; margin-left: 5px;">Categorias</a>
        <span style="color: gray; margin-left: 5px;">Contacto</span>
    </nav>

    <section style="width: 40%;
                    margin: 50px auto;">
        <h1 style="text-align: center;">Contacto</h1>
        <p>
            ¿Tienes una duda sobre orquídeas, quieres compartir una foto de la tuya o encontraste algún error
            en la página? Escríbeme y te respondo apenas pueda.
        </p>

        <form onsubmit="alert('¡Gracias por escribir! Te responderé pronto.'); this.reset(); return false;"
              style="margin-top: 30px;">
            <label for="nombre">Nombre</label><br>
            <input type="text" id="nombre" name="nombre" required
                   style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;"><br>

            <label for="correo">Correo electrónico</label><br>
            <input type="email" id="correo" name="correo" required
                   style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;"><br>

            <label for="asunto">¿Sobre qué quieres hablar?</label><br>
            <select id="asunto" name="asunto"
                    style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;">
                <option>Una duda sobre cuidados</option>
                <option>Quiero compartir mi orquídea</option>
                <option>Encontré un error en la página</option>
                <option>Otra cosa</option>
            </select><br>

            <label for="mensaje">Mensaje</label><br>
            <textarea id="mensaje" name="mensaje" rows="6" required
                      style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;"></textarea><br>

            <button type="submit"
                    style="background-color: #6a9a5b;
                           color: white;
                           border: none;
                           padding: 10px 25px;
                           cursor: pointer;">Enviar</button>
        </form>
    </section>

    <footer style="background-color: #f3f3f1;
                   text-align: center;
                   padding: 25px;
                   margin-top: 40px;">
      <p style="margin: 0 0 10px 0;">Sígueme en redes</p>
        <a href="https://www.instagram.com/angealvar?stkn=ejN3ZHcwM21tM2lj" target="_blank" style="color: black; margin: 0 10px;">Instagram</a>
        <a href="https://www.tiktok.com/@vg157075?_r=1&_t=ZS-99zV9Q96Qa7" target="_blank" style="color: black; margin: 0 10px;">TikTok</a>
        <a href="https://www.linkedin.com/in/vanessa-gonz%C3%A1lez-3a83751a2?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" style="color: black; margin: 0 10px;">Linkedin</a>
    </footer>
</body>
</html>
